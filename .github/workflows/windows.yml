name: Build Windows installer
on:
  push:
    branches: [silverlight-interaction-fixes-20261026,feature/tab-editors-family-tree,feature/canvas-sheets-timelines-sources, feature/codex-library-search-highlights, fix/codex-link-lazy-targets, fix/navigation-performance-codex-links, fix/editor-selection-drag-dismiss, feature/codex-chapter-artwork-tiles, fix/epub-toc-chapter-titles, feature/codex-artwork-context-menus, feature/codex-reading-research, feature/next-release-polish, fix/large-drive-sync-desktop-auth, main, feature/rich-notes-board-navigation, feature/workspace-polish, feature/milanote-import, feature/milanote-clipboard, feature/clipboard-layout-selection]
    paths:
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/**'
      - 'windows/**'
      - 'tests/**'
      - 'tests/validate.cjs'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshots and automatic merge
        run: node tests/validate.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify updater file handling
        run: dotnet run --project tests/updater/Updater.Tests.csproj -c Release
      - name: Verify Windows desktop OAuth and encrypted sessions
        run: dotnet run --project tests/auth/Auth.Tests.csproj -c Release
      - name: Verify large-workspace persistence and two-device transfers
        shell: pwsh
        run: |
          npm install --prefix tmp/browser-tests --no-save playwright@1.62.1
          $env:NODE_PATH = "$PWD/tmp/browser-tests/node_modules"
          node tests/browser-regressions.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure public installed-app metadata
        shell: pwsh
        env:
          DESKTOP_CLIENT_VALUE: ${{ secrets.SILVERLIGHT_DESKTOP_CLIENT_VALUE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_CLIENT_VALUE)) { throw "Desktop client build configuration is missing" }
          $config = Get-Content -Raw windows/google-oauth-client.json | ConvertFrom-Json
          $config | Add-Member -NotePropertyName desktop_client_value -NotePropertyValue $env:DESKTOP_CLIENT_VALUE
          $config | ConvertTo-Json | Set-Content -Encoding utf8 windows/google-oauth-client.json
      - name: Verify live Google Desktop client configuration
        shell: pwsh
        run: ./tests/check-google-desktop-config.ps1
      - name: Generate Windows icon from tower artwork
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          @'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          match = re.search(r'class="brandTower"[^>]+src="data:image/webp;base64,([^"]+)"', html)
          if not match:
              raise SystemExit("Missing embedded Silverlight tower art")
          tower = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          tower.resize((256,256), Image.Resampling.LANCZOS).save("windows/app.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Publish Windows application
        shell: pwsh
        run: |
          dotnet publish windows/Silverlight.Windows.csproj -c Release -r win-x64 --self-contained true -p:Version=0.9.0 -p:AssemblyVersion=0.9.0.0 -o windows/publish
      - name: Verify Codex assets are packaged
        shell: pwsh
        run: |
          foreach ($file in @('tab-editors.js','family-tree-core.js','family-tree.js','family-tree.css','canvas-documents-core.js','canvas-documents.js','codex-sources.js','canvas-documents.css','codex-library-core.js','codex-library.js','codex-colors.js','smooth-wheel.js','codex-artwork.js','context-menus.js','codex.css','codex.js','codex-core.js','codex-import.js')) {
            if (!(Test-Path "windows/publish/web/$file")) { throw "Missing packaged Codex asset: $file" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build setup installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.9.0" "windows/installer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Silverlight-Windows-Installer
          path: windows/output/Silverlight-Setup.exe
