name: Build and publish Mind-Map APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Silverlight.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silverlight-APK
          path: Silverlight.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.7.${GITHUB_RUN_NUMBER}" Silverlight.apk --title "Silverlight v0.7.${GITHUB_RUN_NUMBER}" --notes "Mind-Map Android build with update checks on launch against this public repository. Android requires installation approval. Debug signatures can vary between builds; back up boards before installing a replacement." --latest --target "${GITHUB_SHA}"
