name: Build and publish Mind-Map APK
on:
  push:
    branches: [feature/next-release-polish, main, feature/rich-notes-board-navigation, feature/workspace-polish, feature/milanote-import, feature/milanote-clipboard, feature/clipboard-layout-selection]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshots and automatic merge
        run: node tests/validate.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in SIGNING_KEY KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required signing secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/silverlight-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/silverlight-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          certificate=$(keytool -list -v -keystore "$RUNNER_TEMP/silverlight-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/.*SHA1: //p' | tr -d '\r')
          test "$certificate" = '9F:2F:5C:1E:80:A8:57:99:97:25:E4:F9:80:E5:25:A8:D7:6E:11:E1' || { echo "::error::Signing identity changed; refusing an incompatible Android update"; exit 1; }
          echo "Verified existing Android release signing identity"
      - name: Generate Silverlight tower launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          match = re.search(r'class="brandTower"[^>]+src="data:image/webp;base64,([^"]+)"', html)
          if not match:
              raise SystemExit("Missing embedded Silverlight tower art")
          tower = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          path = Path("app/src/main/res/drawable-nodpi/silverlight_tower.png")
          path.parent.mkdir(parents=True, exist_ok=True)
          tower.resize((512, 512), Image.Resampling.LANCZOS).save(path)
          PY
      - name: Build and sign release APK
        env:
          SILVERLIGHT_KEYSTORE: ${{ runner.temp }}/silverlight-release.jks
          SILVERLIGHT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SILVERLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SILVERLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Silverlight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Silverlight-signed-APK
          path: Silverlight.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.7.${GITHUB_RUN_NUMBER}" Silverlight.apk --title "Silverlight v0.7.${GITHUB_RUN_NUMBER}" --notes-file RELEASE_NOTES.md --latest --target "${GITHUB_SHA}"
