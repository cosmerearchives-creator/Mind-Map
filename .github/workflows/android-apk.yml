name: Build and publish Mind-Map APK
on:
  push:
    branches: [main, fix/canvas-interaction-performance, feature/sticky-relationships-progress, feature/arcanum-sharing]
    paths:
      - 'app/**'
      - 'windows/**'
      - 'gradle/**'
      - '.github/workflows/windows.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'release-version.json'
      - 'RELEASE_NOTES.md'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/release-major.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshots and automatic merge
        run: node tests/validate.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify bounded Android backup I/O
        run: |
          javac -d "$RUNNER_TEMP/backup-test" app/src/main/java/com/cosmerearchives/silverlight/BackupIO.java tests/BackupIOTest.java
          java -Xmx32m -cp "$RUNNER_TEMP/backup-test" com.cosmerearchives.silverlight.BackupIOTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in SIGNING_KEY KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required signing secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/silverlight-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/silverlight-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          certificate=$(keytool -list -v -keystore "$RUNNER_TEMP/silverlight-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/.*SHA1: //p' | tr -d '\r')
          test "$certificate" = '9F:2F:5C:1E:80:A8:57:99:97:25:E4:F9:80:E5:25:A8:D7:6E:11:E1' || { echo "::error::Signing identity changed; refusing an incompatible Android update"; exit 1; }
          echo "Verified existing Android release signing identity"
      - name: Generate Silverlight tower launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          match = re.search(r'class="brandTower"[^>]+src="data:image/webp;base64,([^"]+)"', html)
          if not match:
              raise SystemExit("Missing embedded Silverlight tower art")
          tower = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          path = Path("app/src/main/res/drawable-nodpi/silverlight_tower.png")
          path.parent.mkdir(parents=True, exist_ok=True)
          tower.resize((512, 512), Image.Resampling.LANCZOS).save(path)
          PY
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Android content-URI cold and warm sharing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-sharing-test-results
          path: app/build/reports/androidTests/
      - name: Build and sign release APK
        env:
          SILVERLIGHT_KEYSTORE: ${{ runner.temp }}/silverlight-release.jks
          SILVERLIGHT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SILVERLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SILVERLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-1 digest: 9f2f5c1e80a857999725e4f980e525a8d76e11e1'
          "$(dirname "$APKSIGNER")/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          config = json.loads(Path('release-version.json').read_text())
          badging = Path(os.environ['RUNNER_TEMP'], 'apk-badging.txt').read_text()
          package = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert package and package.groups() == ('com.cosmerearchives.silverlight', str(config['androidVersionCode']), config['androidVersion']), 'APK update identity/version mismatch'
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              for source in Path('app/src/main/assets').rglob('*'):
                  if source.is_file():
                      target = 'assets/' + source.relative_to('app/src/main/assets').as_posix()
                      assert hashlib.sha256(apk.read(target)).digest() == hashlib.sha256(source.read_bytes()).digest(), 'Packaged asset mismatch: ' + target
          print('PASS: Android package/version and every current shared asset match the release source')
          PY
          cp "$APK" Silverlight.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Silverlight-signed-APK
          path: Silverlight.apk
