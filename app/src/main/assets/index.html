// Heuristic: individual runs are merged into lines, then adjacent lines are combined into editable paragraph cards.
function groupPageText(items,pageWidth,pageHeight,pageNumber){const pieces=[];for(const item of items){const raw=String(item.str||'').trim();if(!raw||!item.transform)continue;const x=item.transform[4],y=pageHeight-item.transform[5],h=Math.max(7,Math.hypot(item.transform[2],item.transform[3])||Math.abs(item.height)||11);if(!Number.isFinite(x+y)||x< -20||y < -25)continue;pieces.push({text:raw,x,y,h,w:item.width||raw.length*h*.48})}pieces.sort((a,b)=>a.y-b.y||a.x-b.x);const lines=[];for(const p of pieces){let line=lines.find(l=>Math.abs(l.y-p.y)<Math.max(3,Math.min(8,p.h*.55))&&p.x>=l.x-15&&p.x<l.maxX+180);if(!line){line={x:p.x,y:p.y,maxX:p.x+p.w,h:p.h,parts:[]};lines.push(line)}line.parts.push(p);line.x=Math.min(line.x,p.x);line.maxX=Math.max(line.maxX,p.x+p.w);line.h=Math.max(line.h,p.h)}lines.forEach(l=>{l.parts.sort((a,b)=>a.x-b.x);l.text=l.parts.map(p=>p.text).join(' ')});lines.sort((a,b)=>a.y-b.y||a.x-b.x);const groups=[];for(const l of lines){let prev=groups.at(-1);const gap=prev?l.y-prev.lastY:Infinity;const aligned=prev&&Math.abs(prev.x-l.x)<Math.max(25,pageWidth*.045);const related=prev&&aligned&&gap>=-3&&gap<Math.max(22,l.h*2.0)&&Math.abs(prev.lastWidth-(l.maxX-l.x))<pageWidth*.55&&prev.lines.length<12;if(!related){prev={x:l.x,y:l.y,lastY:l.y,lastWidth:l.maxX-l.x,width:l.maxX-l.x,lines:[],page:pageNumber};groups.push(prev)}prev.lines.push(l.text);prev.lastY=l.y;prev.lastWidth=l.maxX-l.x;prev.width=Math.max(prev.width,l.maxX-prev.x)}return groups.map(g=>({page:g.page,x:g.x,y:g.y,width:g.width,text:g.lines.join('\n')})).filter(g=>g.text.trim().length>1)}

function pdfRgbAt(ctx,x,y){try{const q=ctx.getImageData(Math.max(0,Math.min(ctx.canvas.width-1,Math.round(x))),Math.max(0,Math.min(ctx.canvas.height-1,Math.round(y))),1,1).data;return [q[0],q[1],q[2]]}catch{return [255,255,255]}}
function pdfCardColor(ctx,g,k){const x=g.x*k,y=g.y*k, w=Math.max(20,g.width*k);const samples=[[x-7,y+5],[x+5,y-10],[x+w*.5,y-9],[x+w+6,y+5]].filter(([a,b])=>a>1&&b>1&&a<ctx.canvas.width-2&&b<ctx.canvas.height-2).map(([a,b])=>pdfRgbAt(ctx,a,b));if(!samples.length)return '#ffffff';const rgb=[0,1,2].map(i=>Math.round(samples.reduce((v,c)=>v+c[i],0)/samples.length));const spread=Math.max(...rgb)-Math.min(...rgb);if(spread<12||rgb.every(v=>v>242))return '#ffffff';const options=COLORS.slice(1).map(color=>{const z=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));return {color,dist:z.reduce((t,n,i)=>t+(n-rgb[i])**2,0)}}).sort((a,b)=>a.dist-b.dist);return options[0].dist<21000?options[0].color:'#ffffff'}
function matMul(a,b){return [a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]}
async function pdfImageRegions(page,lib,ctx,k,pageNumber){const ops=await page.getOperatorList(),F=lib.OPS,stack=[];let m=[1,0,0,1,0,0],regions=[];for(let i=0;i<ops.fnArray.length;i++){const op=ops.fnArray[i],args=ops.argsArray[i];if(op===F.save)stack.push(m.slice());else if(op===F.restore)m=stack.pop()||[1,0,0,1,0,0];else if(op===F.transform)m=matMul(m,args);else if([F.paintImageXObject,F.paintJpegXObject,F.paintInlineImageXObject,F.paintImageXObjectRepeat].includes(op)){const pts=[[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]]),xs=pts.map(q=>q[0]),ys=pts.map(q=>page.view[3]-q[1]);let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;if(w<36||h<30||w*h<1900||x<0||y<0||regions.length>=14)continue;const sx=Math.floor(x*k),sy=Math.floor(y*k),sw=Math.min(ctx.canvas.width-sx,Math.ceil(w*k)),sh=Math.min(ctx.canvas.height-sy,Math.ceil(h*k));if(sw<=4||sh<=4)continue;const crop=document.createElement('canvas');const factor=Math.min(1,420/sw,330/sh);crop.width=Math.max(1,Math.round(sw*factor));crop.height=Math.max(1,Math.round(sh*factor));crop.getContext('2d').drawImage(ctx.canvas,sx,sy,sw,sh,0,0,crop.width,crop.height);regions.push({kind:'image',page:pageNumber,x:Math.round(x*1.35),y:Math.round(y*1.35),width:Math.min(420,Math.max(160,Math.round(w*1.35))),title:`Image · page ${pageNumber}`,body:'',color:'#ffffff',imageData:crop.toDataURL('image/jpeg',.78)})}}return regions}

function parsePageRange(text,total){if(!text.trim())return Array.from({length:total},(_,i)=>i+1);const pages=new Set();for(const token of text.split(',')){const part=token.trim();const m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Use page ranges such as 1-10, 13, 20-25.');const first=Number(m[1]),last=m[2]?Number(m[2]):first;if(first<1||last>total||first>last)throw Error(`Page selection must be between 1 and ${total}.`);for(let p=first;p<=last;p++)pages.add(p)}return [...pages].sort((a,b)=>a-b)}
async function scanPDF(file){let lib,doc;try{lib=await loadPdfJs();doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}catch(e){modal('PDF unavailable',`<p>${esc(e.message||e)}</p>`,'<button class="primary" id="cancel">Close</button>');$('#cancel').onclick=closeModal;return}
modal('Import PDF',`<p class="pdfStat"><strong>${esc(file.name)}</strong> · ${doc.numPages} pages</p><label>Pages to import (blank = all)<input id="pdfPages" class="field" placeholder="e.g. 1-20, 25" inputmode="text"></label><label>Batch size<select id="pdfBatch" class="field"><option value="5">5 pages</option><option value="10" selected>10 pages</option><option value="20">20 pages</option></select></label><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="pdfImages" checked>Recover image regions and note colors (slower)</label><div class="pdfNotice">No fixed page cap. Large PDFs may still hit browser memory or local storage limits. Work is analyzed on your device; review before importing.</div>`,'<button class="outline" id="cancel">Cancel</button><button class="primary" id="beginPdf">Analyze pages</button>');$('#cancel').onclick=()=>{closeModal();doc.destroy()};$('#beginPdf').onclick=async()=>{let pages;try{pages=parsePageRange($('#pdfPages').value,doc.numPages)}catch(e){alert(e.message);return}const batch=Number($('#pdfBatch').value),appearance=$('#pdfImages').checked;const job={cancelled:false};currentPdfJob=job;const groups=[],images=[];let yOffset=0;modal('Analyzing PDF',`<div class="pdfStat" id="pdfProgress">Starting…</div><progress id="pdfBar" max="${pages.length}" value="0" style="width:100%;height:17px"></progress><div class="pdfNotice">You can cancel between pages. No board changes are applied until you approve the preview.</div>`,'<button class="outline" id="cancelPdf">Cancel analysis</button>');$('#cancelPdf').onclick=()=>{job.cancelled=true;$('#cancelPdf').disabled=true;$('#cancelPdf').textContent='Cancelling…'};
try{for(let i=0;i<pages.length;i++){if(job.cancelled)break;const p=pages[i];const label=$('#pdfProgress');if(label)label.textContent=`Page ${p} · ${i+1} of ${pages.length} selected`;await new Promise(requestAnimationFrame);const page=await doc.getPage(p);try{const vp=page.getViewport({scale:1}),tc=await page.getTextContent(),pg=groupPageText(tc.items,vp.width,vp.height,p);let ctx=null,k=1.2;if(appearance){const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width*k);canvas.height=Math.ceil(vp.height*k);ctx=canvas.getContext('2d',{willReadFrequently:true});await page.render({canvasContext:ctx,viewport:page.getViewport({scale:k})}).promise}pg.forEach(g=>groups.push({...g,x:Math.round(g.x*1.35),y:Math.round(g.y*1.35+yOffset),width:Math.round(g.width*1.35),color:ctx?pdfCardColor(ctx,g,k):'#ffffff'}));if(ctx){try{const found=await pdfImageRegions(page,lib,ctx,k,p);found.forEach(g=>images.push({...g,y:g.y+yOffset}))}catch(e){console.warn('Image recovery skipped:',e)}ctx.canvas.width=0;ctx.canvas.height=0}yOffset+=vp.height*1.35+110}finally{page.cleanup()}const bar=$('#pdfBar');if(bar)bar.value=i+1;if((i+1)%batch===0)await new Promise(r=>setTimeout(r,0))}if(!groups.length&&!images.length){closeModal();alert(job.cancelled?'Analysis cancelled; no content found in completed pages.':'No selectable text or identifiable image regions found. Scanned PDFs may require OCR.');return}pdfImportPreview(file,groups,images,doc.numPages,job.cancelled?'cancelled after '+(groups.length+images.length)+' items':pages.length);if(job.cancelled){const n=$('#modalRoot .pdfNotice');if(n)n.textContent='Analysis was cancelled. The preview contains only pages already processed. You can import these results or discard them.'}}catch(e){modal('PDF analysis interrupted',`<p>${esc(e.message||e)}</p><div class="pdfNotice">Try smaller page ranges or disable image recovery to reduce memory usage.</div>`,'<button class="primary" id="cancel">Close</button>');$('#cancel').onclick=closeModal}f function pdfImportPreview(file,groups,images,total,read){let title=file.name.replace(/\.pdf$/i,'');modal('Preview reconstructed board',`<label>Board name<input id="pdfBoardName" class="field" value="${esc(title)}" maxlength="120"></label><div class="pdfStat"><strong>${groups.length} editable text cards</strong> and <strong>${images.length} movable image cards</strong> identified across ${read} (document: ${total} pages).</div><div class="pdfNotice">Best-effort appearance recovery: text remains editable; images are movable raster crops. Note boundaries, exact connections, and every original color cannot be guaranteed. Imported images are saved with the workspace in IndexedDB when your browser supports it; very large imports can still exhaust device storage.</div><div class="pdfPreview">${groups.slice(0,12).map(g=>`<div class="pdfPage" style="border-left:6px solid ${g.color}"><strong>Page ${g.page}</strong><div class="pdfSample">${esc(g.text.slice(0,220))}${g.text.length>220?'…':''}</div></div>`).join('')}${images.slice(0,5).map(g=>`<div class="pdfPage"><strong>Image from page ${g.page}</strong><img src="${g.imageData}" style="max-height:110px;max-width:100%;display:block;margin-top:8px"></div>`).join('')}${groups.length>12||images.length>5?`<div class="pdfStat">More items will be included in the import.</div>`:''}</div>`,'<button class="outline" id="cancel">Cancel</button><button class="primary" id="confirmPdf">Import board</button>');$('#cancel').onclick=closeModal;$('#confirmPdf').onclick=async()=>{const name=$('#pdfBoardName').value.trim()||title||'Imported PDF';const board={id:id(),title:name,updated:Date.now(),connections:[],cards:[...groups.map((g,i)=>({id:id(),kind:'text',title:`Page ${g.page} · ${i+1}`,body:g.text,color:g.color,x:g.x+30,y:g.y+30,width:Math.min(420,Math.max(160,g.width+25)),source:{file:file.name,page:g.page,type:'pdf-text'}})),...images.map(g=>({...g,id:id(),x:g.x+30,y:g.y+30,source:{file:file.name,page:g.page,type:'pdf-image'}}))]};try{await  const size=stickySize(c),cx=c.x+size.width/2,cy=c.y+size.height/2,target=collectionAt(b,cx,cy,c.id),oldParent=c.collectionId;
 if(target){c.collectionId=target.id;if(target.collectionLayout!=='free'){const siblings=collectionChildren(b,target).filter(x=>x.id!==c.id).sort((a,z)=>(a.collectionOrder??a.y)-(z.collectionOrder??z.y));let index=siblings.findIndex(x=>cy<x.y+stickySize(x).height/2);if(index<0)index=siblings.length;siblings.splice(index,0,c);siblings.forEach((x,i)=>x.collectionOrder=i)}else constrainSticky(c,target)}else{delete c.collectionId;delete c.collectionOrder}
 if(oldParent&&oldParent!==c.collectionId){const old=b.cards.find(x=>x.id===oldParent);if(old)collectionChildren(b,old).sort((a,z)=>(a.collectionOrder??a.y)-(z.collectionOrder??z.y)).forEach((x,i)=>x.collectionOrder=i)}
 arrangeCollections(b);
}
const navigationBack=[];
const noteTools=installNoteTools({esc,board:activeBoard,state:()=>state,mutate,modal,close:closeModal,navigate:ensureTab,view,size:stickySize,redraw:()=>{render();updateTransform()},persist:save,remember:()=>{navigationBack.push({id:state.active,view:{...view()}})}});
const oldCardBody=cardBody;cardBody=function(c){if(['nested','shortcut'].includes(c.kind)&&c.titlePosition==='beside')return '<div class="boardRow">'+(c.boardIconData?'<img alt="" src="'+esc(SilverlightImages.url(c.boardIconData,48*view().scale*(devicePixelRatio||1)))+'" data-display-image="'+SilverlightImages.key(c.boardIconData)+'" decoding="async">':'')+'<span>'+esc(c.title)+'</span></div>';if(c.kind==='pin')return '<div class="noteBody">📍 '+esc(c.title)+'</div>';if(c.kind==='shortcut')return '<span class="nestedFullButton" data-shortcut="'+esc(c.id)+'">'+esc(c.title)+'</span>';if(c.kind==='text'||c.kind==='task')return '<div class="noteBody richBody">'+noteTools.html(c.body||'Tap twice to edit')+'</div>';return oldCardBody(c)};
const oldDrawCards=drawCards;drawCards=function(){oldDrawCards();const b=activeBoard();if(!b)return;for(const el of document.querySelectorAll('#cardLayer [data-card]')){const c=boardRuntime.prepare(b).byId.get(el.dataset.card);if(!c)continue;if(['nested','shortcut'].includes(c.kind)&&!c.body?.trim()&&(!c.titlePosition||c.titlePosition==='inside')){el.classList.add('boardTitleOnly');const title=el.querySelector('.nestedFullButton'),menu=el.querySelector('.noteMenu');if(title&&menu){title.innerHTML='<span class="boardTitleText">'+esc(c.title||'Untitled board')+'</span>';title.append(menu)}}if(['nested','shortcut'].includes(c.kind)&&['below','hidden'].includes(c.titlePosition)){el.classList.add('boardArt');if(c.titlePosition==='below'&&!el.querySelector(':scope > .boardTitleBelow'))el.insertAdjacentHTML('beforeend','<div class="boardTitleBelow"'+(c.titleLabelWidth?' style="width:'+Number(c.titleLabelWidth)+'px;left:50%;transform:translateX(-50%)"':'')+'>'+esc(c.title)+'</div>')}}};
function inlineNote(c,el){if(el.querySelector('.inlineNoteEditor'))return;const panel=document.createElement('div');panel.className='inlineNoteEditor';panel.innerHTML='<textarea hidden></textarea><button data-done-inline>Save</button><button data-cancel-inline>Cancel</button>';el.append(panel);const field=panel.querySelector('textarea');field.value=c.body||'';noteTools.editor(field);const shell=field.nextElementSibling;shell.append(panel.querySelector('[data-done-inline]'),panel.querySelector('[data-cancel-inline]'));panel.onpointerdown=e=>e.stopPropagation();shell.onclick=e=>{e.stopPropagation();if(e.target.closest('[data-done-inline]')){if(shell._home)shell.remove();mutate(()=>{c.body=field.value;activeBoard().updated=Date.now()})}if(e.target.closest('[data-cancel-inline]')){shell.remove();panel.remove()}};}
const oldEditCard=editCard;editCard=function(cid){oldEditCard(cid);const c=activeBoard()?.cards.find(c=>c.id===cid);if(!c)return;if(['text','task','nested','link'].includes(c.kind))noteTools.editor($('#cardBody'));if(['nested','shortcut'].includes(c.kind)){const root=$('#modalRoot .backgroundControls');root.insertAdjacentHTML('beforebegin','<label>Title position<select class="field" id="boardTitlePosition"><option value="inside">Inside</option><option value="below">Below image / icon</option><option value="beside">Beside image / icon</option><option value="hidden">Hidden</option></select></label>');$('#boardTitlePosition').value=c.titlePosition||'inside';if(c.kind==='shortcut'){root.insertAdjacentHTML('beforebegin','<button class="outline" id="changeShortcut">Choose destination Board / pin</button><div id="shortcutDestination"></div>');let destination={boardId:c.boardId,pinId:c.pinId||''};const describe=()=>{$('#shortcutDestination').textContent=state.boards.find(b=>b.id===destination.boardId)?.title||'Missing board';$('#shortcutDestination').dataset.boardId=destination.boardId;$('#shortcutDestination').dataset.pinId=destination.pinId};describe();$('#changeShortcut').onclick=()=>noteTools.picker((b,pin)=>{destination={boardId:b.id,pinId:pin};describe()});const save=$('#confirm').onclick;$('#confirm').onclick=()=>{save()}}const save=$('#confirm').onclick;$('#confirm').onclick=()=>{save()}}};
function saveStateAndRender(){save();render()}
const oldRender=render;render=function(){oldRender();if(!$('#canvas'))return;const toolbar=$('#canvas .tagToolbar');toolbar.insertAdjacentHTML('beforeend','<button class="outline" id="navigationBack">← Back</button><button class="outline" id="unsortedLibrary">Unsorted ('+(activeBoard().unsorted||[]).length+')</button><button class="outline" id="pasteToLibrary">Paste</button><button class="outline" id="newBoardShortcut">Board shortcut</button>');$('#navigationBack').disabled=!navigationBack.length;$('#navigationBack').onclick=()=>{const prev=navigationBack.pop();if(!prev){render();return}if(state.boards.some(b=>b.id===prev.id)){ensureTab(prev.id);Object.assign(view(),prev.view);save();render();updateTransform()}else render()};$('#unsortedLibrary').onclick=()=>noteTools.unsorted();$('#pasteToLibrary').onclick=()=>noteTools.paste();$('#newBoardShortcut').onclick=()=>{const v=view(),r=$('#canvas').getBoundingClientRect();noteTools.picker((b,pin)=>{noteTools.create('shortcut',(r.width/2-v.x)/v.scale,(r.height/2-v.y)/v.scale,b.id,pin);closeModal()})};setupWorkspaceUI()};
const oldCreateCardAt=createCardAt;createCardAt=function(x,y){oldCreateCardAt(x,y);const tabs=$('#modalRoot .stickyEditorTabs');tabs.insertAdjacentHTML('beforeend','<button type="button" id="createPin">Location Pin</button>');$('#createPin').onclick=()=>{const r=$('#canvas').getBoundingClientRect(),v=view();noteTools.create('pin',(x-r.left-v.x)/v.scale,(y-r.top-v.y)/v.scale);closeModal()};const enhance=()=>{if($('#nestedToggle')&&!$('#nestedToggle').checked)noteTools.editor($('#cardBody'))};enhance();tabs.querySelectorAll('[data-create-tab]').forEach(btn=>btn.addEventListener('click',enhance))};
document.addEventListener('click',e=>{const shortcut=e.target.closest('[data-shortcut]');if(shortcut&&!e.target.closest('[data-cardmenu]')){const c=activeBoard().cards.find(c=>c.id===shortcut.dataset.shortcut);noteTools.go(c.boardId,c.pinId)}},true);

boardRuntime=installBoardRuntime({size:stickySize,header:collectionHeaderHeight,view,gesture:()=>gesture,wires:ids=>drawWires(ids),selection:()=>desktopSelection.sync(),draw:()=>drawCards()});
const desktopSelection=installDesktopSelection({board:activeBoard,card:id=>boardRuntime.prepare(activeBoard()).byId.get(id),query:r=>boardRuntime.query(r),boards:()=>state.boards,view,size:stickySize,busy:()=>!!paintSession||!!connectFrom,draw:()=>drawCards(),transform:updateTransform,persist:save,snapshot,mutate,clipboard:(...args)=>noteTools.nativeRequest(...args),dragging:ids=>{gesture=ids?{kind:'selectionDrag',ids}:null},drop:(c,g)=>dropCollectionCard(activeBoard(),c,g),commit:()=>{activeBoard().updated=Date.now();future=[];save();render()},create:(x,y)=>createCardAt(x,y)});
const selectionDraw=drawCards;drawCards=function(){if(boardRuntime.fast(gesture))return;boardRuntime.cancel();selectionDraw();desktopSelection.sync();SilverlightImages.refresh(view().scale)};
window.SilverlightPerformance={stats:boardRuntime.stats,visible:()=>document.querySelectorAll('#cardLayer [data-card]').length};
render();initDatabase();})();
</script></body></html>
