plugins { id 'com.android.application' }

android {
 namespace 'com.cosmerearchives.silverlight'
 compileSdk 35
 defaultConfig {
  applicationId 'com.cosmerearchives.silverlight'
  minSdk 26
  targetSdk 35
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  versionCode 1400001
  versionName '0.14.1'
 }
 signingConfigs {
  release {
   def keyPath = System.getenv('SILVERLIGHT_KEYSTORE')
   if (keyPath) {
    storeFile file(keyPath)
    storePassword System.getenv('SILVERLIGHT_KEYSTORE_PASSWORD')
    keyAlias System.getenv('SILVERLIGHT_KEY_ALIAS')
    keyPassword System.getenv('SILVERLIGHT_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   signingConfig signingConfigs.release
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
dependencies {
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
